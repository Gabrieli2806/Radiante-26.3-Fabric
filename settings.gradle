pluginManagement {
	repositories {
		maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
		maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
		maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
		gradlePluginPortal()
		mavenCentral()
	}
	plugins {
		id 'net.fabricmc.fabric-loom' version "${loom_version}"
		id 'net.neoforged.moddev' version "${moddev_version}"
		id 'net.minecraftforge.gradle' version "${forgegradle_version}"
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'radiante'

// common: everything that is plain Minecraft. Each loader module compiles those sources together with its own
// entrypoint and a RadiantePlatform implementation.
def enabledLoaders = providers.gradleProperty('enabled_loaders')
	.orElse('fabric,neoforge,forge').get().split(',').collect { it.trim() }
def unknownLoaders = enabledLoaders.findAll { !(it in ['fabric', 'neoforge', 'forge']) }
if (!unknownLoaders.isEmpty()) {
	throw new GradleException("Unknown enabled_loaders: ${unknownLoaders.join(', ')}")
}
include 'common'
enabledLoaders.each { include it }
